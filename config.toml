# ----------------------------------------------------------------
# Recipe: Helix Editor Configuration
# ----------------------------------------------------------------

### ================================
### TEMA & VISUAL
### ================================
theme = "dark_plus"

[editor]
line-number = "relative"
cursorcolumn = true
cursorline = true
true-color = true
mouse = true

### --------------------------------
### Language Server Protocol (LSP)
### --------------------------------
[editor.lsp]
auto-signature-help = false
enable = false

### --------------------------------
### Cursor & File Picker
### --------------------------------
[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.file-picker]
hidden = false

### ================================
### MAPEAMENTOS DE TECLAS
### ================================
[keys.normal]
del = "delete_char_forward"
backspace = "delete_char_backward"

[keys.select]
del = "delete_selection"
backspace = "delete_selection"
