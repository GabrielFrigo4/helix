# ----------------------------------------------------------------
# Recipe: Helix Editor Configuration
# ----------------------------------------------------------------

### ================================
### TEMA & VISUAL
### ================================
theme = "dark_plus"

[editor]
line-number = "relative"
cursorcolumn = true
cursorline = true
mouse = true

### --------------------------------
### Language Server Protocol
### --------------------------------
[editor.lsp]
auto-signature-help = true
enable = true

### --------------------------------
### Cursor & File Picker
### --------------------------------
[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.file-picker]
hidden = false

### --------------------------------
### Statusline & Indicators
### --------------------------------
[editor.statusline]
left = ["mode", "spinner", "file-name", "read-only-indicator", "file-modification-indicator"]
center = []
right = ["diagnostics", "selections", "position", "file-encoding", "file-line-ending", "file-type"]
separator = "│"
mode.normal = "NORMAL"
mode.insert = "INSERT"
mode.select = "SELECT"

### ================================
### MAPEAMENTOS DE TECLAS
### ================================
[keys.normal]
del = "delete_char_forward"
backspace = "delete_char_backward"
"C-h" = "jump_view_left"
"C-j" = "jump_view_down"
"C-k" = "jump_view_up"
"C-l" = "jump_view_right"
"A-]" = "rotate_view"
"A-[" = "file_picker_in_current_directory"
"C-\\" = "file_picker_in_current_directory"
"C-p" = "file_picker"
"C-f" = "file_picker"
"C-b" = "buffer_picker"
"C-g" = "global_search"

[keys.normal.g]
n = "goto_next_buffer"
p = "goto_previous_buffer"

[keys.normal."C-w"]
h = "jump_view_left"
j = "jump_view_down"
k = "jump_view_up"
l = "jump_view_right"
s = "hsplit"
v = "vsplit"
q = "wclose"

[keys.select]
del = "delete_selection"
backspace = "delete_selection"
