# ----------------------------------------------------------------
# Recipe: Helix Languages Configuration
# ----------------------------------------------------------------

### ================================
### LANGUAGE SERVERS
### ================================

[language-server.clangd]
command = "clangd"
args = ["--background-index", "--clang-tidy", "--completion-style=detailed", "--header-insertion=iwyu", "--fallback-style=llvm"]

[language-server.tinymist]
command = "tinymist"

[language-server.nil]
command = "nil"

### ================================
### LANGUAGES
### ================================

[[language]]
name = "c"
language-servers = ["clangd"]
auto-format = true
indent = { tab-width = 4, unit = "\t" }
formatter = { command = "clang-format" }

[[language]]
name = "cpp"
language-servers = ["clangd"]
auto-format = true
indent = { tab-width = 4, unit = "\t" }
formatter = { command = "clang-format" }

[[language]]
name = "c-sharp"
indent = { tab-width = 4, unit = "\t" }

[[language]]
name = "rust"
auto-format = true
indent = { tab-width = 4, unit = "\t" }

[[language]]
name = "zig"
auto-format = true
indent = { tab-width = 4, unit = "\t" }

[[language]]
name = "go"
auto-format = true
indent = { tab-width = 4, unit = "\t" }

[[language]]
name = "java"
indent = { tab-width = 4, unit = "\t" }

[[language]]
name = "python"
auto-format = true
indent = { tab-width = 4, unit = "\t" }

[[language]]
name = "lua"
auto-format = true
indent = { tab-width = 4, unit = "\t" }

[[language]]
name = "ruby"
indent = { tab-width = 4, unit = "\t" }

[[language]]
name = "javascript"
auto-format = true
indent = { tab-width = 4, unit = "\t" }

[[language]]
name = "html"
indent = { tab-width = 4, unit = "\t" }

[[language]]
name = "css"
indent = { tab-width = 4, unit = "\t" }

[[language]]
name = "typst"
language-servers = ["tinymist"]
auto-format = true
indent = { tab-width = 2, unit = " " }

[[language]]
name = "nix"
language-servers = ["nil"]
auto-format = true
indent = { tab-width = 2, unit = " " }

### ================================
### TOOLS & SHELL
### ================================

[[language]]
name = "bash"
language-servers = ["bash-language-server"]
auto-format = true
indent = { tab-width = 4, unit = "\t" }
formatter = { command = "shfmt", args = ["-i", "0", "-s", "-ci"] }

[[language]]
