# Author: dgkf
# Adapted for Universal Environment: 16-Color TTY & Clean Monochrome Cursors

"ui.background" = { }
"ui.background.separator" = { fg = "red" }

# Cursor Scopes — Fixed Monochrome Alpha Blending (Zero-Inversion, Zero-Green)
"ui.cursor"                  = { fg = "black", bg = "white" }
"ui.cursor.normal"           = { fg = "black", bg = "white" }
"ui.cursor.insert"           = { fg = "black", bg = "light-gray" }
"ui.cursor.select"           = { fg = "white", bg = "gray" }
"ui.cursor.match"            = { fg = "black", bg = "white" }

"ui.cursor.primary"          = { fg = "black", bg = "white" }
"ui.cursor.primary.normal"   = { fg = "black", bg = "white" }
"ui.cursor.primary.insert"   = { fg = "black", bg = "light-gray" }
"ui.cursor.primary.select"   = { fg = "white", bg = "gray" }

"ui.cursor.secondary"        = { fg = "black", bg = "light-gray" }
"ui.cursor.secondary.normal" = { fg = "black", bg = "light-gray" }
"ui.cursor.secondary.insert" = { fg = "white", bg = "gray" }
"ui.cursor.secondary.select" = { fg = "white", bg = "gray" }

"ui.cursorline.primary" = { bg = "black" }
"ui.gutter" = { }
"ui.gutter.selected" = { bg = "black" }
"ui.help" = { fg = "white", bg = "black" }
"ui.linenr" = { fg = "gray", modifiers = ["bold"] }
"ui.linenr.selected" = { fg = "white", modifiers = ["bold"] }
"ui.menu" = { fg = "light-gray", bg = "gray" }
"ui.menu.selected" = { modifiers = ["reversed"] }
"ui.menu.scroll" = { fg = "light-blue" }
"ui.popup" = { bg = "black" }
"ui.selection" = { bg = "gray" }
"ui.statusline" = { fg = "white", bg = "blue" }
"ui.statusline.inactive" = { fg = "light-gray", bg = "black" }
"ui.virtual" = { bg = "black" }
"ui.virtual.indent-guide" = { fg = "gray" }
"ui.virtual.whitespace" = { }
"ui.virtual.wrap" = { fg = "gray" }
"ui.virtual.inlay-hint" = { fg = "light-gray", modifiers = ["dim", "italic"] }
"ui.virtual.inlay-hint.parameter" = { fg = "yellow", modifiers = ["dim", "italic"] }
"ui.virtual.inlay-hint.type" = { fg = "blue", modifiers = ["dim", "italic"] }
"ui.window" = { fg = "gray", modifiers = ["dim"] }

"comment" = { fg = "gray", modifiers = ["bold"] }

"attribute" = "light-yellow"
"constant" = { fg = "light-yellow", modifiers = ["bold"] }
"constant.numeric" = "light-yellow"
"constant.character.escape" = "light-cyan"
"constructor" = "light-blue"
"function" = "light-blue"
"function.macro" = "light-red"
"function.builtin" = { fg = "light-blue", modifiers = ["bold"] }
"tag" = { fg = "light-magenta" }
"type" = "blue"
"type.builtin" = { fg = "blue", modifiers = ["bold"] }
"type.enum.variant" = { fg = "light-magenta" }
"string" = "light-green"
"special" = "light-red"
"variable" = "white"
"variable.parameter" = { fg = "light-yellow" }
"variable.other.member" = "light-green"
"keyword" = "light-magenta"
"keyword.control.exception" = "light-red"
"keyword.directive" = { fg = "light-yellow", modifiers = ["bold"] }
"keyword.operator" = { fg = "light-blue", modifiers = ["bold"] }
"label" = "light-green"
"namespace" = { fg = "blue" }

"markup.heading" = "light-blue"
"markup.list" = "light-red"
"markup.bold" = { fg = "light-cyan", modifiers = ["bold"] }
"markup.italic" = { fg = "light-blue", modifiers = ["italic"] }
"markup.strikethrough" = { modifiers = ["crossed_out"] }
"markup.link.url" = { fg = "magenta" }
"markup.link.text" = "light-magenta"
"markup.quote" = "light-cyan"
"markup.raw" = "light-green"

"diff.plus" = "light-green"
"diff.delta" = "light-yellow"
"diff.minus" = "light-red"

"diagnostic.hint" = { underline = { color = "gray", style = "line" } }
"diagnostic.info" = { underline = { color = "light-cyan", style = "line" } }
"diagnostic.warning" = { underline = { color = "light-yellow", style = "line" } }
"diagnostic.error" = { underline = { color = "light-red", style = "line" } }

"info" = "light-cyan"
"hint" = { fg = "light-gray" }
"debug" = "white"
"warning" = "yellow"
"error" = "light-red"
